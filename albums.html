<link rel="stylesheet" href="catalog.css">
<script src="catalog-data.js" defer></script>
<script src="catalog.js" defer></script>
</head>
<body>
<aside class="sidebar">

        <div class="site-logo"><a class="site-logo-link" href="index.html" aria-label="홈으로 이동">

            <img
                src="images/logo.png"
                alt="카미츠바키 아카이브"
            >

        </a></div>

        <nav class="side-menu">

            <!-- 홈 -->
            <a class="menu-item" href="index.html">

            </a>


            <!-- 아티스트 -->
            <a class="menu-item" href="artists.html">아티스트</a>

    <main class="main-content catalog-directory" data-catalog="albums">
    <h1 class="catalog-title">ALBUMS</h1>
    <p class="catalog-subtitle">앨범</p>
    <form id="catalog-search" class="catalog-search" role="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="7.5"/><path d="m16 16 5 5"/></svg>
        <input id="catalog-query" type="search" aria-label="앨범, 수록곡 또는 참여 아티스트 검색" placeholder="앨범 · 수록곡 · 아티스트 검색" autocomplete="off">
        <button id="catalog-clear" class="catalog-clear" type="button" aria-label="검색어 지우기" hidden>×</button>
    </form>
    <div class="catalog-toolbar"><div class="catalog-categories" role="group" aria-label="음반 종류"><button type="button" data-release-type="single" aria-pressed="true">싱글</button><button type="button" data-release-type="album" aria-pressed="true">앨범</button></div><label class="catalog-sort-label">정렬 <select id="catalog-sort" aria-label="날짜 정렬"><option value="newest">최신순</option><option value="oldest">오래된순</option></select></label></div>
    <div id="catalog-filter" class="catalog-filter"></div>
    <p id="catalog-status" class="catalog-status" role="status"></p>
    <div id="catalog-results" class="catalog-results"></div>
</main>
</body>
